name: Deploy wiki to GitHub Pages

# Publishes the wiki as a Quartz site (graph view, backlinks, resolved
# [[wikilinks]]) on every push to main. This content repo stays pristine:
# the workflow clones Quartz in CI, drops the markdown into it, and builds.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wiki content
        uses: actions/checkout@v4
        with:
          path: wiki

      - name: Checkout Quartz (pinned)
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4.5.2
          path: quartz

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Quartz dependencies
        working-directory: quartz
        run: npm ci

      - name: Assemble content
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          rm -rf quartz/content
          mkdir -p quartz/content
          # wiki/* skips dotfiles (.git, .github, .gitignore) by glob
          cp -R wiki/* quartz/content/
          # the 4 MB source is in the repo but isn't a page — keep the site lean
          rm -f quartz/content/raw/archive.json
          # not pages: the API service code, and unreviewed conversation drafts
          rm -rf quartz/content/api quartz/content/inbox
          # inject custom styling (explorer scroll fix, etc.); .quartz is a dotfile
          # so it was skipped by the wiki/* copy above and isn't a published page
          if [ -f wiki/.quartz/custom.scss ]; then
            cp wiki/.quartz/custom.scss quartz/quartz/styles/custom.scss
          fi
          # Apply the same title and graph settings used by the local preview.
          # A one-hop expanded graph is deliberate: at depth 3 the home page reaches
          # nearly the entire 8k-page archive and stalls the browser before rendering.
          node wiki/scripts/configure_quartz.mjs quartz \
            --base-url "$PAGES_BASE_URL" \
            --graph-depth 1

      - name: Build site
        working-directory: quartz
        run: npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
